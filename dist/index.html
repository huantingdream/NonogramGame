<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143fbf" />
    <meta
      name="description"
      content="格间小游戏合集：数织 Nonogram、数独、扫雷、2048、数回、数桥，可自动生成题目并支持排行榜。"
    />
    <title>格间 · 小游戏合集</title>
    <link rel="stylesheet" href="./css/base.css?v=20260922-2" />
    <link rel="stylesheet" href="./css/games.css?v=20260922-2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="格间小游戏首页">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span><strong>格间</strong><small id="brandSubtitle">NONOGRAM</small></span>
        </a>

        <button class="game-picker-button" id="gamePickerButton" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="gamePickerModal">
          <span class="game-icon" aria-hidden="true">▦</span>
          <strong class="current-game-name">选择游戏</strong>
          <span class="game-picker-label">切换游戏</span>
          <span aria-hidden="true">⌄</span>
        </button>

        <div class="topbar-actions">
          <button class="topbar-button" id="leaderboardButton" type="button">
            <span aria-hidden="true">♛</span> 排行榜
          </button>
          <button class="topbar-button account-button" id="accountButton" type="button">
            <span class="account-dot" aria-hidden="true"></span><span id="accountButtonLabel">登录</span>
          </button>
          <button class="how-to-button" id="howToButton" type="button" aria-expanded="false">
            <span aria-hidden="true">?</span> 怎么玩
          </button>
        </div>
      </header>

      <section class="game-layout" aria-label="游戏区">
        <aside class="control-panel" id="controlPanel"></aside>

        <section class="board-card">
          <div class="board-header">
            <div>
              <span class="puzzle-number" id="puzzleNumber">PUZZLE #0000</span>
              <h2 id="boardTitle">准备中…</h2>
            </div>
            <div class="status-cluster" aria-label="游戏状态">
              <div><span>用时</span><strong id="timer">00:00</strong></div>
              <div><span>状态</span><strong class="game-status" id="gameStatus" data-tone="idle">未提交</strong></div>
            </div>
          </div>

          <div class="board-stage">
            <div class="board-scroll">
              <div id="gameRoot"></div>
            </div>
          </div>

          <div class="board-toolbar" id="boardToolbar"></div>
          <p class="desktop-tip" id="desktopTip"></p>
        </section>
      </section>
    </main>

    <dialog class="modal game-picker-modal" id="gamePickerModal" aria-labelledby="gamePickerTitle">
      <button class="modal-close" type="button" data-close-picker aria-label="关闭游戏选择">×</button>
      <span class="modal-kicker">GAME LIBRARY</span>
      <h2 id="gamePickerTitle">今天，玩点什么？</h2>
      <label class="game-search" for="gameSearch">
        <span aria-hidden="true">⌕</span>
        <input id="gameSearch" type="search" placeholder="搜索游戏名称，如数桥、2048" aria-label="搜索游戏" autocomplete="off" />
      </label>
      <div class="game-categories" id="gameCategories" role="group" aria-label="游戏分类"></div>
      <div class="recent-games" id="recentGames" hidden>
        <span>最近玩过</span><div class="recent-game-list"></div>
      </div>
      <p class="game-result-count" id="gameResultCount" role="status" aria-live="polite"></p>
      <div class="game-library" id="gameLibrary" aria-label="游戏列表"></div>
      <p class="game-search-empty" id="gameSearchEmpty" hidden>没有找到这款游戏，换个名称或分类试试。</p>
    </dialog>

    <dialog class="modal" id="howToModal">
      <button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button>
      <span class="modal-kicker">HOW TO PLAY</span>
      <h2 id="howToTitle">怎么玩</h2>
      <div id="howToContent"></div>
      <button class="primary-button" type="button" data-close-modal>开始游戏</button>
    </dialog>

    <dialog class="modal victory-modal" id="victoryModal">
      <div class="victory-badge" aria-hidden="true">✓</div>
      <span class="modal-kicker">PUZZLE COMPLETE</span>
      <h2>挑战成功！</h2>
      <p id="victorySummary">你用 00:00 完成了这道题。</p>
      <div class="victory-score-card">
        <p id="victoryScoreMessage">登录后可以把成绩放进排行榜。</p>
        <button class="secondary-button" id="scoreActionButton" type="button">登录并上传成绩</button>
      </div>
      <button class="primary-button" id="nextPuzzleButton" type="button">再来一题</button>
    </dialog>

    <dialog class="modal auth-modal" id="authModal">
      <button class="modal-close" type="button" data-close-auth aria-label="关闭">×</button>
      <div id="signedOutPanel">
        <span class="modal-kicker">PLAYER ACCOUNT</span>
        <h2 id="authTitle">登录</h2>
        <div class="auth-mode-switch" role="tablist" aria-label="登录或注册">
          <button type="button" role="tab" aria-selected="true" data-auth-mode="login">登录</button>
          <button type="button" role="tab" aria-selected="false" data-auth-mode="register">注册</button>
        </div>
        <form id="authForm">
          <label class="form-field" id="nicknameField" hidden>
            <span>排行榜昵称</span>
            <input id="nicknameInput" name="nickname" type="text" minlength="1" maxlength="20" autocomplete="nickname" placeholder="1–20 个字符" />
          </label>
          <label class="form-field">
            <span>邮箱</span>
            <input id="emailInput" name="email" type="email" autocomplete="email" required placeholder="name@example.com" />
          </label>
          <label class="form-field">
            <span>密码</span>
            <input id="passwordInput" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位" />
          </label>
          <p class="form-message" id="authMessage" role="status" aria-live="polite"></p>
          <button class="primary-button" id="authSubmitButton" type="submit">登录</button>
        </form>
      </div>
      <div class="signed-in-panel" id="signedInPanel" hidden>
        <span class="modal-kicker">PLAYER ACCOUNT</span>
        <div class="account-avatar" id="accountAvatar" aria-hidden="true">玩</div>
        <h2 id="accountName">玩家</h2>
        <p id="accountEmail"></p>
        <button class="secondary-button danger-button" id="signOutButton" type="button">退出登录</button>
      </div>
    </dialog>

    <dialog class="modal leaderboard-modal" id="leaderboardModal">
      <button class="modal-close" type="button" data-close-leaderboard aria-label="关闭">×</button>
      <span class="modal-kicker">LEADERBOARD</span>
      <h2>最快完成榜</h2>
      <div class="leaderboard-filters">
        <label><span>游戏</span><select id="leaderboardGame"></select></label>
        <label><span>规格</span><select id="leaderboardSize"></select></label>
        <label><span>难度</span><select id="leaderboardDifficulty"></select></label>
      </div>
      <div class="leaderboard-state" id="leaderboardState" role="status" aria-live="polite">登录后查看排行榜。</div>
      <ol class="leaderboard-list" id="leaderboardList"></ol>
      <button class="secondary-button" id="leaderboardLoginButton" type="button">登录后查看</button>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js?v=20260922-2"></script>
  </body>
</html>
