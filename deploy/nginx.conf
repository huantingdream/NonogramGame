server {
    listen 80;
    listen [::]:80;
    server_name games.huantingdream.site;
    server_tokens off;
    include /etc/nginx/snippets/gejian-cloudflare-real-ip.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://games.huantingdream.site$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name games.huantingdream.site;
    server_tokens off;
    include /etc/nginx/snippets/gejian-cloudflare-real-ip.conf;
    ssl_certificate /etc/letsencrypt/live/games.huantingdream.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.huantingdream.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
